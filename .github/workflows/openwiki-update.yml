# Issue コメント「/openwiki」で OpenWiki のドキュメントを再生成し PR を作る。
# 生成先は documents/openwiki/（documents/ を作業ディレクトリにして実行）。
# LLM プロバイダは Gemini。GitHub の Secrets に GEMINI_API_KEY が必要。
name: OpenWiki Update

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: openwiki-update
  cancel-in-progress: false

jobs:
  # コマンド実行者と Issue 起票者の両方が admin かを判定するゲート。
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ( github.event.issue.pull_request == null &&
        startsWith(github.event.comment.body, '/openwiki') )
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.perm.outputs.allowed }}
    steps:
      - id: perm
        uses: actions/github-script@v7
        with:
          script: |
            // 必要権限。A→B に変える場合はこの判定を write/maintain も許可するよう緩める。
            const REQUIRED = 'admin';
            const permLevel = async (username) => {
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username,
                });
                return data.permission; // 'admin' | 'write' | 'read' | 'none'
              } catch (e) {
                core.warning(`権限取得に失敗 (${username}): ${e.message}`);
                return 'none';
              }
            };

            const actor = context.actor;
            const actorPerm = await permLevel(actor);
            const isComment = context.eventName === 'issue_comment';
            const author = isComment ? context.payload.issue.user.login : null;
            const authorPerm = isComment ? await permLevel(author) : REQUIRED;

            if (actorPerm === REQUIRED && authorPerm === REQUIRED) {
              core.setOutput('allowed', 'true');
              return;
            }
            core.setOutput('allowed', 'false');

            const reason = actorPerm !== REQUIRED
              ? `コマンド実行者 @${actor} が管理者ではありません (${actorPerm})。`
              : `Issue 起票者 @${author} が管理者ではありません (${authorPerm})。管理者が Issue を起票し直してください。`;
            core.notice(reason);
            if (isComment) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `⛔ ${reason}`,
              });
            }

  update:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: コメントに 👀 を付ける
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          # full history: openwiki が「最後に文書化したコミット」との差分を取るため。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: OpenWiki をインストール
        # mermaid / jsdom は Mermaid 図の検証用（任意）。図を使わないなら削除可。
        run: npm install --global openwiki mermaid@11.16.0 jsdom@29.1.1

      - name: OpenWiki を実行
        id: openwiki
        continue-on-error: true
        working-directory: documents
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 無料枠で 429 が出るなら gemini-2.5-flash に。大きめの図解が必要なら pro。
          OPENWIKI_MODEL_ID: gemini-2.5-flash
          # CI からの匿名テレメトリを無効化。
          OPENWIKI_TELEMETRY_DISABLED: "1"

      - name: 一時ファイルを削除
        if: ${{ !cancelled() }}
        run: rm -f -- documents/openwiki/.run.json

      - name: PR を作成
        id: cpr
        if: ${{ !cancelled() }}
        uses: peter-evans/create-pull-request@v7
        with:
          # documents/openwiki のみコミット対象にする。
          # openwiki が生成しうる AGENTS.md / CLAUDE.md / ワークフロー等は含めない。
          add-paths: documents/openwiki
          branch: openwiki/update
          delete-branch: true
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            OpenWiki ドキュメントの自動更新。

            - 契機: ${{ github.event_name == 'issue_comment' && format('Issue #{0} のコメント', github.event.issue.number) || '手動実行' }}
            - OpenWiki 実行結果: `${{ steps.openwiki.outcome }}`

            結果が `failure` の場合、失敗前に生成できたページのみが含まれます。
            マージすると次回実行時の基準になります。

      - name: 結果を Issue にコメント
        if: ${{ !cancelled() && github.event_name == 'issue_comment' }}
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.cpr.outputs.pull-request-url }}";
            const outcome = "${{ steps.openwiki.outcome }}";
            let body;
            if (url) {
              body = `${outcome === 'success' ? '✅' : '⚠️'} OpenWiki 更新 (${outcome}): ${url}`;
            } else {
              body = `ℹ️ 差分がありませんでした（更新結果: ${outcome}）。`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: OpenWiki の失敗を伝播
        if: ${{ steps.openwiki.outcome == 'failure' }}
        run: exit 1
