# Issue コメント「/openspec archive <change-id>」で OpenSpec の変更をアーカイブし PR を作る。
# archive は API キー不要・ルールベース（documents/openspec/ 配下で実行）。
name: OpenSpec Archive

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      change_id:
        description: "アーカイブする change-id"
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: openspec-archive-${{ github.event.issue.number || github.event.inputs.change_id }}
  cancel-in-progress: false

jobs:
  archive:
    # Issue（PR ではない）へのコメントで、コマンド形式かつ権限のある人のみ。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ( github.event.issue.pull_request == null &&
        startsWith(github.event.comment.body, '/openspec archive') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) )
    runs-on: ubuntu-latest
    steps:
      - name: コメントに 👀 を付ける
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

      - name: change-id を取り出す
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            let change;
            if (context.eventName === 'workflow_dispatch') {
              change = context.payload.inputs.change_id;
            } else {
              const m = context.payload.comment.body.trim()
                .match(/^\/openspec\s+archive\s+([A-Za-z0-9._/-]+)/);
              if (!m) {
                core.setFailed('使い方: `/openspec archive <change-id>`');
                return;
              }
              change = m[1];
            }
            core.setOutput('change', change);

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: documents/openspec/ の存在確認
        run: |
          if [ ! -d documents/openspec ]; then
            echo "::error::documents/openspec/ が未初期化です。ローカルで 'cd documents && npx -y @fission-ai/openspec@latest init' を実行してコミットしてください。"
            exit 1
          fi

      - name: openspec archive を実行
        working-directory: documents
        run: npx -y @fission-ai/openspec@latest archive "${{ steps.parse.outputs.change }}" --yes

      - name: PR を作成
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: documents/openspec
          branch: openspec/archive-${{ steps.parse.outputs.change }}
          delete-branch: true
          commit-message: "spec: archive ${{ steps.parse.outputs.change }}"
          title: "spec: archive ${{ steps.parse.outputs.change }}"
          body: |
            OpenSpec の自動アーカイブ。

            - change-id: `${{ steps.parse.outputs.change }}`
            - 契機: ${{ github.event_name == 'issue_comment' && format('Issue #{0} のコメント', github.event.issue.number) || '手動実行' }}

            `openspec archive ${{ steps.parse.outputs.change }} --yes` の結果。

      - name: 結果を Issue にコメント
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.cpr.outputs.pull-request-url }}";
            const body = url
              ? `✅ \`${{ steps.parse.outputs.change }}\` をアーカイブしました: ${url}`
              : `ℹ️ 差分がありませんでした（既にアーカイブ済みか、対象が見つかりません）。`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
