# Issue コメント「/opsx:propose <アイデア>」で OpenSpec の変更提案を作成し PR を作る。
# spec の執筆は Claude Code（claude-code-action）が担当。認証は Claude サブスクの OAuth トークン。
# OpenSpec の実体は documents/openspec/ にあるため、openspec コマンドは documents/ で実行させる。
name: OpenSpec Propose

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: openspec-propose-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # コマンド実行者と Issue 起票者の両方が admin かを判定するゲート。
  gate:
    if: >-
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/opsx:propose')
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.perm.outputs.allowed }}
    steps:
      - id: perm
        uses: actions/github-script@v7
        with:
          script: |
            // 必要権限。A→B に変える場合はこの判定を write/maintain も許可するよう緩める。
            const REQUIRED = 'admin';
            const permLevel = async (username) => {
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username,
                });
                return data.permission; // 'admin' | 'write' | 'read' | 'none'
              } catch (e) {
                core.warning(`権限取得に失敗 (${username}): ${e.message}`);
                return 'none';
              }
            };

            const actor = context.actor;
            const actorPerm = await permLevel(actor);
            const isComment = context.eventName === 'issue_comment';
            const author = isComment ? context.payload.issue.user.login : null;
            const authorPerm = isComment ? await permLevel(author) : REQUIRED;

            if (actorPerm === REQUIRED && authorPerm === REQUIRED) {
              core.setOutput('allowed', 'true');
              return;
            }
            core.setOutput('allowed', 'false');

            const reason = actorPerm !== REQUIRED
              ? `コマンド実行者 @${actor} が管理者ではありません (${actorPerm})。`
              : `Issue 起票者 @${author} が管理者ではありません (${authorPerm})。管理者が Issue を起票し直してください。`;
            core.notice(reason);
            if (isComment) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `⛔ ${reason}`,
              });
            }

  propose:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: コメントに 👀 を付ける
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: openspec CLI をインストール
        run: npm install -g @fission-ai/openspec@latest

      - name: documents/openspec/ の存在確認
        run: |
          if [ ! -d documents/openspec ]; then
            echo "::error::documents/openspec/ が未初期化です。ローカルで 'cd documents && npx -y @fission-ai/openspec@latest init --tools claude' を実行してコミットしてください。"
            exit 1
          fi

      - name: Claude Code で提案を作成
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: main
          branch_prefix: openspec/
          use_commit_signing: true
          claude_args: |
            --max-turns 40
          prompt: |
            あなたは OpenSpec の「変更提案(propose)」ワークフローを実行します。

            ## 厳守事項
            - このリポジトリの OpenSpec 実体は `documents/openspec/` にあります。
              `openspec` コマンドは必ず `documents/` をカレントにして実行してください
              （例: `cd documents && openspec new change "<name>"`）。
            - 手順書は `documents/.claude/skills/openspec-propose/SKILL.md` です。
              まずこれを読み、記載の手順に厳密に従ってください。
            - **計画のみ**。実装コードの編集・apply ワークフローの開始は禁止。
              proposal.md / specs 差分 / design.md / tasks.md などの成果物のみ作成します。
            - スコープ・互換性・受け入れ条件に関わる重要な曖昧さがある場合は、
              成果物を作らず、最後に質問だけを述べて停止してください（推測で作らない）。
            - 完了したら `cd documents && openspec validate --all --strict` を実行し、
              エラーがあれば修正してから終了してください。

            ## 依頼内容
            この Issue の内容が変更の依頼です。タイトルと本文から意図を読み取り、
            ケバブケースの change 名を導出してください。
            トリガーコメントに `/opsx:propose` に続くテキストがあれば、追加の補足指示として扱います
            （なければ Issue 本文だけで判断）。

            ### Issue タイトル
            ${{ github.event.issue.title }}

            ### Issue 本文
            ---
            ${{ github.event.issue.body }}
            ---

            ### 追加の補足（トリガーコメント）
            ---
            ${{ github.event.comment.body }}
            ---
