# app + db をまとめて起動する開発用 compose 構成。
# 認証情報・UID/GID などは .env で指定する（.env.example を参照）。

services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: base-agentic-coding-app:latest
    # 実行時もホストの UID/GID で動かす（マウント先の権限をホストに合わせる）。
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-app}
      DB_USER: ${POSTGRES_USER:-app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-app}
    # 必要に応じてホストのソースをマウント（権限がホストユーザーと一致する）。
    # volumes:
    #   - ./src:/src
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    image: base-agentic-coding-db:latest
    # ホストの UID/GID で起動。bind mount 先（./data/db）の所有者と一致させる。
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      # 非 root 起動時に initdb が参照するホームディレクトリ対策。
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # 名前付きボリュームではなく bind mount にすることで
      # ホスト側ディレクトリの権限を UID/GID で制御できる。
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
